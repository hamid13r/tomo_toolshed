name: publish

# Build on every v* tag and publish via PyPI Trusted Publishing (OIDC — no
# API tokens stored in the repo).
#
# One-time setup on pypi.org:
#   Account -> Publishing -> add a GitHub trusted publisher with
#   owner: hamid13r, repo: tomo_toolshed, workflow: publish.yml,
#   environment: (leave blank — this workflow sends no environment claim).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
