[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tomo-toolshed"
version = "0.1.0"
description = "A collection of lightweight cryo-ET file/CLI tools, all under a single tomo_toolshed command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Hamid Rahmani", email = "hrahmani@scripps.edu" }]
keywords = ["cryo-et", "tomography", "warp", "etomo", "segmentation", "curation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "pandas>=1.3",
    "lxml>=4.6",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-image>=0.19",
    "mrcfile>=1.4",
    "connected-components-3d>=3.10",
    "matplotlib>=3.5",
    "starfile>=0.5",
    "networkx>=2.6",
    "pillow>=9.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/hamid13r/tomo_toolshed"
Issues = "https://github.com/hamid13r/tomo_toolshed/issues"
Repository = "https://github.com/hamid13r/tomo_toolshed"

[project.scripts]
tomo_toolshed = "tomo_toolshed.cli:tomo_toolshed"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
