[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "island-curator"
version = "0.1.0"
description = "Interactive CLI + matplotlib GUI to review and clean a 3D segmentation overlaid on a cryo-ET tomogram, then export a curated binary mask."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Hamid Rahmani" }]
keywords = ["cryo-et", "segmentation", "tomography", "connected-components", "curation"]
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "mrcfile",
    "connected-components-3d",
    "matplotlib",
    "click",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
island-curator = "island_curator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
