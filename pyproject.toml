[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warp_recont_test"
version = "0.1.0"
description = "Faithful, hackable NumPy/SciPy re-implementation of WarpTools ts_reconstruct (weighting/filtering experiments)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "mrcfile>=1.4",
    "pillow>=9.0",
]

# NOTE: the distribution / repo is named `warp_recont_test`, but the importable
# Python package stays `warp_recon` (so existing `import warp_recon` code and the
# tested modules keep working). `pip install -e .` gives you both the
# `warp_recon` package and the `warp-recont-test` command below.
[project.scripts]
warp-recont-test = "reconstruct_tomo:main"

[tool.setuptools]
py-modules = ["reconstruct_tomo"]
packages = ["warp_recon"]
