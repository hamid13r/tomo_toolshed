[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warp_recont_test"
version = "0.1.0"
description = "Faithful, hackable NumPy/SciPy re-implementation of WarpTools ts_reconstruct (weighting/filtering experiments)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
dependencies = [
    "click",
    "numpy>=1.23",
    "scipy>=1.9",
    "mrcfile>=1.4",
    "pillow>=9.0",
]

[project.optional-dependencies]
test = ["pytest"]

# NOTE: the distribution / repo is named `warp_recont_test`, but the importable
# Python package stays `warp_recon`. `pip install -e .` gives you both the
# `warp_recon` package and the `warp-recont-test` command below.
[project.scripts]
warp-recont-test = "warp_recon.cli:xml_reconstruct"

[tool.setuptools]
packages = ["warp_recon"]
